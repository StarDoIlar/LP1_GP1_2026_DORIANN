<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida Animada</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: aparecer 1.2s ease;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            animation: deslizar 1s ease;
        }

        p {
            margin-bottom: 20px;
            animation: deslizar 1.4s ease;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #ff7a18;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            animation: aparecer 2s ease;
        }

        button:hover {
            background: #ff5722;
            transform: scale(1.1) rotate(2deg);
        }

        .mensaje {
            margin-top: 20px;
            font-weight: bold;
            opacity: 0;
        }

        .mostrar {
            animation: fadeIn 1s forwards;
        }

        /* Animaciones */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes deslizar {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Fondo con burbujas animadas */
        .burbuja {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            animation: subir 10s infinite ease-in;
        }

        .burbuja:nth-child(1) { left: 10%; animation-duration: 8s; }
        .burbuja:nth-child(2) { left: 30%; animation-duration: 12s; }
        .burbuja:nth-child(3) { left: 50%; animation-duration: 10s; }
        .burbuja:nth-child(4) { left: 70%; animation-duration: 14s; }
        .burbuja:nth-child(5) { left: 90%; animation-duration: 9s; }

        @keyframes subir {
            from {
                transform: translateY(0) scale(1);
                opacity: 0.5;
            }
            to {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Burbujas -->
    <div class="burbuja"></div>
    <div class="burbuja"></div>
    <div class="burbuja"></div>
    <div class="burbuja"></div>
    <div class="burbuja"></div>

    <div class="container">
        <h1>¡Bienvenido!</h1>
        <p>Gracias por visitar nuestra página</p>
        <button onclick="mostrarMensaje()">Haz clic aquí</button>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <script>
        function mostrarMensaje() {
            const mensaje = document.getElementById("mensaje");
            mensaje.textContent = "🎉 ¡Te damos la bienvenida!";
            mensaje.classList.add("mostrar");
        }
    </script>

</body>
</html>
